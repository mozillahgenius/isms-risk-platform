# Google Workspace コネクタ（reader）— 設計書 3.2
#
# 正本は Git のこのファイル。DB（catalog.connector_manifests）はその投影で、
# 投入は db/seeds/0003_connectors.py だけが行う（検証を通らないと入らない）。
#
# **版ごとに別ファイルにする。** app.integrations が (connector, manifest_version) を
# FK 参照するので、一度でも使われた版は消せない。1 つのファイルを上書きして version だけ
# 上げると、DB を作り直したときに古い版を再現できなくなる。
connector: google_workspace
kind: reader
version: 3

auth:
  type: service_account_dwd
  # reader は read-only スコープしか書けない（検証で強制）。
  scopes:
    - https://www.googleapis.com/auth/admin.directory.user.readonly
    - https://www.googleapis.com/auth/admin.directory.group.readonly
    - https://www.googleapis.com/auth/admin.directory.domain.readonly
    - https://www.googleapis.com/auth/admin.reports.audit.readonly
    - https://www.googleapis.com/auth/drive.readonly
    - https://www.googleapis.com/auth/drive.metadata.readonly

# 出せる HTTP メソッドを宣言する。reader / elevated_reader は GET / HEAD のみ
# （スコープが read-only でも、POST が書ければ実行時には書き込めてしまう）。
http:
  methods: [GET]
  # 到達してよいホスト。ここに無いホストへは出られない（資格情報の外部送出を構造で防ぐ）。
  allowed_hosts:
    - www.googleapis.com
    - admin.googleapis.com

resources:
  - name: users
    endpoint: admin/directory/v1/users
    params: {customer: my_customer, projection: full}
    paging: {type: page_token, param: pageToken, size: 500}
    map_to: accounts
    fields:
      external_id: id              # 不変 ID。メールを一次キーにしない
      email: primaryEmail
      suspended: suspended
      mfa_enrolled: isEnrolledIn2Sv
      is_admin: isAdmin
      last_login_at: lastLoginTime
    on_error: {403: fail_run, 429: retry}

  - name: groups
    endpoint: admin/directory/v1/groups
    params: {customer: my_customer}
    paging: {type: page_token, param: pageToken, size: 200}
    map_to: groups
    fields:
      external_id: id
      name: name
      email: email                 # Drive の permission がグループを emailAddress で指す
    on_error: {403: fail_run, 429: retry}

  - name: group_members
    endpoint: admin/directory/v1/groups/{group_id}/members
    iterate_over: {resource: groups, bind: {group_id: external_id}}
    paging: {type: page_token, param: pageToken, size: 200}
    map_to: memberships_graph
    fields:
      account_external_id: id
      member_type: type
    on_error: {404: skip, 403: record_as_unreadable, 429: retry}

  - name: oauth_tokens
    endpoint: admin/directory/v1/users/{user_id}/tokens
    iterate_over: {resource: users, bind: {user_id: external_id}}
    paging: {type: none}
    map_to: app_grants
    fields:
      oauth_app_external_id: clientId
      scopes: scopes
      display_name: displayText
    on_error: {404: skip, 403: record_as_unreadable, 429: retry}

  - name: drive_files
    endpoint: drive/v3/files
    params:
      supportsAllDrives: true
      includeItemsFromAllDrives: true
      corpora: allDrives
      q: "trashed = false"
      fields: "nextPageToken,files(id,name,mimeType,owners,driveId,parents,modifiedTime)"
    paging: {type: page_token, param: pageToken, size: 1000}
    map_to: resources
    fields:
      external_id: id
      name: name
      kind: mimeType
      drive_id: driveId
      last_modified_at: modifiedTime
    incremental:
      type: changes_api
      cursor_scope: [per_impersonated_user, per_shared_drive]
      cursor: startPageToken
      on_cursor_invalid: fallback_full_scan_for_that_scope
    on_error: {403: record_as_unreadable, 404: record_as_gone, 429: retry}

  - name: drive_permissions
    endpoint: drive/v3/files/{file_id}/permissions
    iterate_over: {resource: drive_files, bind: {file_id: external_id}}
    params:
      supportsAllDrives: true
      fields: "nextPageToken,permissions(id,type,role,domain,emailAddress,allowFileDiscovery,expirationTime)"
    paging: {type: page_token, param: pageToken, size: 100}
    depends_on: drive_files
    map_to: grants
    fields:
      subject_kind: $derive.permission_subject_kind   # type + domain から導出
      subject_domain: domain
      subject_account_email: emailAddress
      role: role
      discoverable: allowFileDiscovery
      expires_at: expirationTime
    on_error: {403: record_as_unreadable, 404: record_as_gone, 429: retry}

  - name: admin_reports_login
    endpoint: admin/reports/v1/activity/users/all/applications/login
    params: {maxResults: 1000}
    paging: {type: page_token, param: pageToken, size: 1000}
    map_to: raw_events
    fields:
      external_id: id.uniqueQualifier
      occurred_at: id.time
      event_type: events.name
      actor_email: actor.email
    incremental: {type: time_window, cursor: startTime}
    on_error: {403: record_as_unreadable, 429: retry}

rate_limit:
  strategy: token_bucket
  qps: 8
  concurrency: 4
  backoff: exponential_jitter
  max_retries: 5
  respect_headers: [Retry-After]

sync:
  full: weekly
  incremental: hourly
