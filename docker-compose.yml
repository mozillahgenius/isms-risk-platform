# 設計書 11.2 の配備構成。Mac mini 上で Tailscale 越しに社内限定で動かす想定。
#
# 現時点で中身があるのは postgres と minio だけ。web / worker / scheduler /
# auditlogd は Phase 1 以降の実装が入ってから追加する（空のサービスを並べると
# 「もう在る」ように見えるので置かない）。
#
# 設計書 11.3 の移設可能性の制約:
#   - ローカルファイルシステムに状態を書かない（Postgres と MinIO のみ）
#   - ホスト名・パスをコードに埋めない（環境変数で渡す）
#   - macOS 固有機能に依存しない（スケジューラは専用コンテナ。launchd を使わない）
services:
  postgres:
    # 設計書 11.1 は PostgreSQL 16。開発機は Docker が無く 17 で検証しているため、
    # ここを正として PG16 で CI を回すこと（docs/DECISIONS.md D-11）。
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isms}
      POSTGRES_USER: ${POSTGRES_USER:-isms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD は必須。既定値を持たせない}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # 社内限定。0.0.0.0 で公開しない
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER は必須}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD は必須}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
